<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错题复习</title>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* 本页专属：错题复习样式 */
        .m-hero { text-align: center; padding-top: 36px; }
        .m-hero h1 { font-size: 26px; margin: 0 0 8px; }
        .m-hero p { color: var(--muted); font-size: 14px; margin: 0; }

        .m-stats { max-width: 860px; margin: 24px auto 0; padding: 0 16px; display: flex; gap: 14px; }
        .m-stat {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
            text-align: center;
        }
        .m-stat .num { font-size: 26px; font-weight: 700; color: var(--accent); }
        .m-stat.st-green .num { color: #2e9e5b; }
        .m-stat .label { font-size: 13px; color: var(--muted); margin-top: 4px; }
        .m-progress { height: 6px; background: var(--border); border-radius: 3px; margin-top: 10px; overflow: hidden; }
        .m-progress i { display: block; height: 100%; background: #2e9e5b; border-radius: 3px; transition: width .3s; }

        .m-tabs { max-width: 860px; margin: 20px auto 0; padding: 0 16px; display: flex; gap: 10px; }
        .m-tab {
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            cursor: pointer;
            font-size: 14px;
        }
        .m-tab:hover { border-color: var(--accent); color: var(--accent); }
        .m-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

        .m-list { max-width: 860px; margin: 16px auto 40px; padding: 0 16px; }
        .m-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 22px;
            margin-bottom: 16px;
        }
        .m-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .m-chip { font-size: 12px; border-radius: 999px; padding: 2px 10px; border: 1px solid var(--accent); color: var(--accent); }
        .m-chip.kw { border-color: var(--border); color: var(--muted); }
        .m-chip.wrong { border-color: #d04a4a; color: #d04a4a; }
        .m-chip.ok { border-color: #2e9e5b; color: #2e9e5b; }
        .m-time { margin-left: auto; font-size: 12px; color: var(--muted); }
        .m-q { font-size: 15px; line-height: 1.6; margin: 10px 0 4px; }
        .m-last { font-size: 13px; color: #d04a4a; margin: 4px 0; }

        .m-actions { display: flex; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
        .m-btn {
            height: 34px;
            padding: 0 18px;
            border: none;
            border-radius: 17px;
            font-size: 13px;
            cursor: pointer;
        }
        .m-btn.primary { background: var(--accent); color: #fff; }
        .m-btn.primary:hover { background: var(--accent-hover); }
        .m-btn.primary:disabled { opacity: .55; cursor: not-allowed; }
        .m-btn.ghost { background: none; border: 1px solid var(--border); color: var(--text); }
        .m-btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
        .m-link { font-size: 13px; color: var(--muted); text-decoration: underline; cursor: pointer; }
        .m-link:hover { color: var(--accent); }
        .m-link.danger { color: #d04a4a; }
        .m-link.danger:hover { color: #b03a3a; }

        .m-review { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
        .m-options { list-style: none; padding: 0; margin: 0 0 6px; }
        .m-options li {
            font-size: 14px;
            line-height: 1.6;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .m-options li:hover { background: var(--bubble-ai); }
        .m-options li.selected { border-color: var(--accent); background: var(--bubble-ai); }
        .m-options li.correct { background: rgba(46,158,91,.14); color: #2e9e5b; font-weight: 600; }
        .m-options li.wrong { background: rgba(208,74,74,.14); color: #d04a4a; }
        .m-options li.locked { cursor: default; }
        .m-options li.locked:hover { background: transparent; }
        .m-input {
            width: 100%;
            min-height: 88px;
            margin-bottom: 6px;
            padding: 10px 12px;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.6;
            outline: none;
            resize: vertical;
            font-family: inherit;
        }
        .m-input:focus { border-color: var(--accent); }
        .m-feedback { display: none; margin-top: 10px; padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.7; }
        .m-feedback.ok { display: block; background: rgba(46,158,91,.1); color: #2e9e5b; }
        .m-feedback.bad { display: block; background: rgba(208,74,74,.1); color: #d04a4a; }
        .m-answer-area { display: none; margin-top: 10px; }
        .m-answer-area .m-a { font-size: 13px; color: #2e9e5b; margin-bottom: 4px; }
        .m-answer-area .m-e { font-size: 13px; color: var(--muted); line-height: 1.6; }

        .m-empty { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 0; line-height: 2; }
        .m-empty a { color: var(--accent); }
        .m-loading { text-align: center; color: var(--muted); font-size: 14px; padding: 30px 0; }
    </style>
</head>
<body>
    <!-- 左侧引导栏 -->
    <div class="sidebar">
        <div class="logo">AGZ</div>
        <a class="module" href="../index.html">首页</a>
        <a class="module" href="页面1.html">ai助手</a>
        <a class="module" href="页面2.html">智能出题</a>
        <a class="module" href="页面3.html">错题复习</a>
        <a class="module" href="页面4.html">学习计划</a>
        <a class="module" href="页面5.html">概念图解</a>
        <a class="module" href="../paiti/index.html">拍题学习</a>

        <!-- 登录状态区（由 script.js 渲染） -->
        <div class="user-area">
            <a class="module" id="loginLink" href="../login.html">登录 / 注册</a>
            <span class="user-name" id="userName" style="display:none"></span>
            <a class="module" id="logoutLink" href="javascript:void(0)" onclick="logout()" style="display:none">退出登录</a>
        </div>
    </div>

    <!-- 内容区 -->
    <div class="box">
        <!-- 顶部标签栏（快捷跳转） -->
        <div class="tab-bar" id="tabBar"></div>

        <!-- 标题 -->
        <div class="m-hero">
            <h1>📕 错题复习</h1>
            <p>在「智能出题」里答错的题会自动收录到这里 —— 反复练习，直到掌握！</p>
        </div>

        <!-- 统计 -->
        <div class="m-stats">
            <div class="m-stat">
                <div class="num" id="statPending">0</div>
                <div class="label">待复习</div>
            </div>
            <div class="m-stat st-green">
                <div class="num" id="statMastered">0</div>
                <div class="label">已掌握</div>
            </div>
            <div class="m-stat">
                <div class="num" id="statRate">0%</div>
                <div class="label">掌握率</div>
                <div class="m-progress"><i id="rateBar" style="width:0%"></i></div>
            </div>
        </div>

        <!-- 标签页 -->
        <div class="m-tabs" id="mTabs">
            <button class="m-tab active" data-tab="pending">📕 待复习（<span id="pendingCount">0</span>）</button>
            <button class="m-tab" data-tab="mastered">✅ 已掌握（<span id="masteredCount">0</span>）</button>
        </div>

        <!-- 错题列表 -->
        <div class="m-list" id="mistakeList">
            <div class="m-loading">加载中…</div>
        </div>
    </div>

    <!-- 深色/浅色切换按钮 -->
    <button class="theme-btn" id="themeBtn" title="切换深色/浅色模式">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>

    <script>
        // 本页面信息（供 script.js 的标签栏使用）
        var PAGES = {
            home:  { label: '首页',     href: '../index.html' },
            ai:    { label: 'ai助手',   href: '页面1.html' },
            chuti: { label: '智能出题', href: '页面2.html' },
            m3:    { label: '错题复习', href: '页面3.html' },
            m4:    { label: '学习计划',    href: '页面4.html' },
            m5:    { label: '概念图解',    href: '页面5.html' }
            paiti: { label: '拍题学习', href: '../paiti/' }
        };
        var CURRENT = 'm3';
    </script>
    <script src="../script.js"></script>
    <script>
        // ---------- 错题复习（对接后端 /api/mistakes） ----------
        // 未登录直接跳登录页
        var LOGGED = requireLogin('../login.html');

        var LETTERS = ['A', 'B', 'C', 'D'];
        var MISTAKES = { pending: [], mastered: [], stats: { pending: 0, mastered: 0, total: 0, rate: 0 } };
        var CURRENT_TAB = 'pending';

        function el(tag, cls, text) {
            var e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined && text !== null) e.textContent = text;
            return e;
        }

        // UTC 时间转本地显示
        function fmtTime(t) {
            if (!t) return '';
            try {
                return new Date(String(t).replace(' ', 'T') + 'Z').toLocaleString('zh-CN', { hour12: false });
            } catch (e) {
                return t;
            }
        }

        // 从参考答案里提取选项字母（A~D）
        function answerLetter(ref) {
            var m = String(ref || '').match(/[A-Da-d]/);
            return m ? m[0].toUpperCase() : null;
        }

        // 调用后端 AI 批改接口
        function apiGrade(m, userAnswer, cb) {
            api('/api/questions/grade', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    question: m.question,
                    reference_answer: m.answer || '',
                    user_answer: userAnswer
                })
            }).then(function (res) {
                if (res.success && res.data) {
                    cb(res.data, '');
                } else {
                    cb(null, res.message || 'AI 批改失败，请重试');
                }
            }).catch(function () {
                cb(null, '网络错误，请确认后端已启动（localhost:3000）');
            });
        }

        // 加载错题列表 + 统计
        function loadMistakes() {
            var list = document.getElementById('mistakeList');
            list.innerHTML = '<div class="m-loading">加载中…</div>';
            api('/api/mistakes').then(function (res) {
                if (!res.success) {
                    list.innerHTML = '<div class="m-empty">' + (res.message || '加载失败') + '</div>';
                    return;
                }
                MISTAKES = res.data;
                renderStats();
                renderList();
            }).catch(function () {
                list.innerHTML = '<div class="m-empty">网络错误，请确认后端已启动（localhost:3000）</div>';
            });
        }

        function renderStats() {
            var s = MISTAKES.stats || { pending: 0, mastered: 0, total: 0, rate: 0 };
            document.getElementById('statPending').textContent = s.pending;
            document.getElementById('statMastered').textContent = s.mastered;
            document.getElementById('statRate').textContent = s.rate + '%';
            document.getElementById('rateBar').style.width = s.rate + '%';
            document.getElementById('pendingCount').textContent = s.pending;
            document.getElementById('masteredCount').textContent = s.mastered;
        }

        function renderList() {
            var list = document.getElementById('mistakeList');
            list.innerHTML = '';
            var arr = CURRENT_TAB === 'pending' ? MISTAKES.pending : MISTAKES.mastered;
            if (!arr || !arr.length) {
                var empty = el('div', 'm-empty');
                if (CURRENT_TAB === 'pending') {
                    empty.innerHTML = '🎉 太棒了，暂无待复习的错题！<br>去 <a href="页面2.html">智能出题</a> 挑战一下，答错的题会自动收录到这里';
                } else {
                    empty.textContent = '还没有已掌握的错题。在「待复习」里答对一道题，就会自动归入这里。';
                }
                list.appendChild(empty);
                return;
            }
            arr.forEach(function (m) {
                list.appendChild(buildMistakeCard(m));
            });
        }

        // 复习时又答错：错误次数 +1，并就地更新卡片信息
        function recordRetry(m, wrongText, card) {
            api('/api/mistakes/' + m.id + '/retry', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ wrong_answer: wrongText })
            }).then(function (res) {
                if (!res.success || !res.data) return;
                m.wrong_count = res.data.wrong_count;
                m.wrong_answer = wrongText;
                var badge = card.querySelector('.m-chip.wrong');
                if (badge) badge.textContent = '错 ' + m.wrong_count + ' 次';
                var last = card.querySelector('.m-last');
                if (last) {
                    last.textContent = '上次你的答案：' + String(wrongText).slice(0, 120);
                    last.style.display = 'block';
                }
            }).catch(function () { /* 静默失败 */ });
        }

        function removeMistake(m) {
            if (!confirm('确定移除这道错题吗？')) return;
            api('/api/mistakes/' + m.id, { method: 'DELETE' }).then(function (res) {
                if (res.success) loadMistakes();
                else alert(res.message || '移除失败');
            }).catch(function () { alert('网络错误'); });
        }

        // 答对 → 标记已掌握，稍后刷新列表
        function markMastered(m, feedbackText) {
            api('/api/mistakes/' + m.id + '/master', { method: 'POST' })
                .then(function () { setTimeout(loadMistakes, 900); })
                .catch(function () { setTimeout(loadMistakes, 900); });
        }

        function buildMistakeCard(m) {
            var card = el('div', 'm-card');
            var isPending = CURRENT_TAB === 'pending';

            // 头部：类型 / 知识点 / 错误次数 / 时间
            var head = el('div', 'm-head');
            if (m.type) head.appendChild(el('span', 'm-chip', m.type));
            if (m.keyword) head.appendChild(el('span', 'm-chip kw', '📝 ' + m.keyword));
            if (m.wrong_count) head.appendChild(el('span', 'm-chip wrong', '错 ' + m.wrong_count + ' 次'));
            head.appendChild(el('span', 'm-time', fmtTime(isPending ? m.create_time : m.master_time)));
            card.appendChild(head);

            // 题干
            card.appendChild(el('div', 'm-q', m.question));

            // 上次错误答案
            var lastEl = el('div', 'm-last');
            if (isPending && m.wrong_answer) {
                lastEl.textContent = '上次你的答案：' + String(m.wrong_answer).slice(0, 120);
            } else {
                lastEl.style.display = 'none';
            }
            card.appendChild(lastEl);

            // 答案 + 解析（默认隐藏）
            var answerArea = el('div', 'm-answer-area');
            if (m.answer) answerArea.appendChild(el('div', 'm-a', '答案：' + m.answer));
            if (m.explanation) answerArea.appendChild(el('div', 'm-e', '解析：' + m.explanation));
            card.appendChild(answerArea);

            // AI 点评 / 结果反馈（默认隐藏）
            var feedback = el('div', 'm-feedback');
            card.appendChild(feedback);

            // 复习作答区（默认隐藏）
            var review = el('div', 'm-review');
            card.appendChild(review);

            // 操作区
            var actions = el('div', 'm-actions');
            card.appendChild(actions);

            if (isPending) {
                var startBtn = el('button', 'm-btn primary', '重新作答');
                var revealLink = el('a', 'm-link', '直接看答案');
                revealLink.href = 'javascript:void(0)';
                var masterLink = el('a', 'm-link', '已掌握，不用再练');
                masterLink.href = 'javascript:void(0)';
                var delLink = el('a', 'm-link danger', '移除');
                delLink.href = 'javascript:void(0)';
                actions.appendChild(startBtn);
                actions.appendChild(revealLink);
                actions.appendChild(masterLink);
                actions.appendChild(delLink);

                var built = false;
                startBtn.onclick = function () {
                    if (!built) { buildReview(review, m, card, feedback, answerArea); built = true; }
                    review.style.display = 'block';
                    startBtn.style.display = 'none';
                };
                revealLink.onclick = function () { answerArea.style.display = 'block'; };
                masterLink.onclick = function () {
                    if (!confirm('确认这道题已经掌握了吗？')) return;
                    api('/api/mistakes/' + m.id + '/master', { method: 'POST' }).then(function (res) {
                        if (res.success) loadMistakes();
                        else alert(res.message || '操作失败');
                    }).catch(function () { alert('网络错误'); });
                };
                delLink.onclick = function () { removeMistake(m); };
            } else {
                var reopenBtn = el('button', 'm-btn ghost', '重新加入待复习');
                var delLink2 = el('a', 'm-link danger', '移除');
                delLink2.href = 'javascript:void(0)';
                actions.appendChild(reopenBtn);
                actions.appendChild(delLink2);
                reopenBtn.onclick = function () {
                    api('/api/mistakes/' + m.id + '/reopen', { method: 'POST' }).then(function (res) {
                        if (res.success) loadMistakes();
                        else alert(res.message || '操作失败');
                    }).catch(function () { alert('网络错误'); });
                };
                delLink2.onclick = function () { removeMistake(m); };
            }

            return card;
        }

        // 展开复习作答区（选择题 / 简答·应用题）
        function buildReview(review, m, card, feedback, answerArea) {
            review.innerHTML = '';
            var submit = el('button', 'm-btn primary');
            var optionsEls = [];
            var input = null;

            function showFeedback(text, ok) {
                feedback.textContent = text;
                feedback.className = 'm-feedback ' + (ok ? 'ok' : 'bad');
            }
            function resetSubmit(text) {
                submit.disabled = false;
                submit.textContent = text;
                if (input) input.disabled = false;
            }
            function onCorrect(extraComment) {
                optionsEls.forEach(function (o) { o.classList.add('locked'); });
                submit.disabled = true;
                if (input) input.disabled = true;
                showFeedback('🎉 答对了！' + (extraComment || '') + ' 已标记为「已掌握」', true);
                answerArea.style.display = 'block';
                api('/api/mistakes/' + m.id + '/master', { method: 'POST' })
                    .then(function () { setTimeout(loadMistakes, 900); })
                    .catch(function () { setTimeout(loadMistakes, 900); });
            }

            if (m.options && m.options.length) {
                // ---------- 选择题 ----------
                var ol = el('ul', 'm-options');
                m.options.forEach(function (opt, j) {
                    var li = el('li', '', LETTERS[j] + '. ' + opt);
                    li.onclick = function () {
                        if (submit.disabled) return;
                        optionsEls.forEach(function (o) { o.classList.remove('selected'); });
                        li.classList.add('selected');
                        submit.disabled = false;
                    };
                    optionsEls.push(li);
                    ol.appendChild(li);
                });
                review.appendChild(ol);

                submit.textContent = '提交答案';
                submit.disabled = true;
                submit.onclick = function () {
                    var chosen = -1;
                    optionsEls.forEach(function (o, j) {
                        if (o.classList.contains('selected')) chosen = j;
                    });
                    if (chosen < 0) return;
                    var wrongText = LETTERS[chosen] + '. ' + m.options[chosen];
                    var refLetter = answerLetter(m.answer);
                    if (refLetter) {
                        var correctIdx = LETTERS.indexOf(refLetter);
                        if (chosen === correctIdx) {
                            optionsEls[chosen].classList.add('correct');
                            onCorrect();
                        } else {
                            optionsEls[chosen].classList.add('wrong');
                            optionsEls.forEach(function (o) { o.classList.remove('selected'); });
                            showFeedback('✗ 又错了一次，再想想哦', false);
                            recordRetry(m, wrongText, card);
                        }
                    } else {
                        // 旧数据没有字母答案，交给 AI 判
                        submit.disabled = true;
                        submit.textContent = 'AI 批改中…';
                        apiGrade(m, wrongText, function (data, msg) {
                            if (!data) { alert(msg || 'AI 批改失败，请重试'); resetSubmit('提交答案'); return; }
                            if (data.correct) {
                                optionsEls[chosen].classList.add('correct');
                                onCorrect(data.comment);
                            } else {
                                optionsEls[chosen].classList.add('wrong');
                                optionsEls.forEach(function (o) { o.classList.remove('selected'); });
                                showFeedback('✗ ' + (data.comment || '再试一次'), false);
                                recordRetry(m, wrongText, card);
                            }
                        });
                    }
                };
                review.appendChild(submit);
            } else {
                // ---------- 简答/应用题 ----------
                input = el('textarea', 'm-input');
                input.placeholder = '重新作答，输入你的答案…';
                review.appendChild(input);

                submit.textContent = '提交批改';
                submit.onclick = function () {
                    var ans = input.value.trim();
                    if (!ans) { alert('请先输入你的答案'); return; }
                    submit.disabled = true;
                    submit.textContent = 'AI 批改中…';
                    input.disabled = true;
                    apiGrade(m, ans, function (data, msg) {
                        if (!data) { alert(msg || 'AI 批改失败，请重试'); resetSubmit('提交批改'); return; }
                        if (data.correct) {
                            onCorrect(data.comment);
                        } else {
                            input.disabled = false;
                            submit.disabled = false;
                            submit.textContent = '提交批改';
                            showFeedback('✗ ' + (data.comment || '再想想，继续加油'), false);
                            recordRetry(m, ans, card);
                        }
                    });
                };
                review.appendChild(submit);
            }
        }

        // 标签页切换
        document.getElementById('mTabs').addEventListener('click', function (e) {
            var btn = e.target.closest('.m-tab');
            if (!btn) return;
            CURRENT_TAB = btn.getAttribute('data-tab');
            document.querySelectorAll('.m-tab').forEach(function (t) {
                t.classList.toggle('active', t === btn);
            });
            renderList();
        });

        // 页面加载
        loadMistakes();
    </script>
</body>
</html>
