<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习计划</title>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* 本页专属：学习计划样式 */
        .p-hero { text-align: center; padding-top: 36px; }
        .p-hero h1 { font-size: 26px; margin: 0 0 8px; }
        .p-hero p { color: var(--muted); font-size: 14px; margin: 0; }

        .p-stats {
            max-width: 960px;
            margin: 24px auto 0;
            padding: 0 16px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .p-stat {
            flex: 1;
            min-width: 150px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
            text-align: center;
        }
        .p-stat .num { font-size: 26px; font-weight: 700; color: var(--accent); }
        .p-stat.st-fire .num { color: #e8893c; }
        .p-stat.st-green .num { color: #2e9e5b; }
        .p-stat .label { font-size: 13px; color: var(--muted); margin-top: 4px; }
        .p-stat.checkin { cursor: pointer; transition: border-color .15s; }
        .p-stat.checkin:hover { border-color: var(--accent); }
        .p-stat.checkin.done { border-color: #2e9e5b; }
        .p-stat.checkin.done .num { color: #2e9e5b; }

        .p-form-card {
            max-width: 960px;
            margin: 20px auto 0;
            padding: 0 16px;
        }
        .p-form {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 22px;
        }
        .p-form textarea {
            width: 100%;
            min-height: 64px;
            padding: 10px 12px;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.6;
            outline: none;
            resize: vertical;
            font-family: inherit;
        }
        .p-form textarea:focus { border-color: var(--accent); }
        .p-row { display: flex; align-items: center; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
        .p-row label { font-size: 13px; color: var(--muted); }
        .p-row input[type="number"], .p-row select {
            height: 34px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            outline: none;
        }
        .p-row input[type="number"] { width: 64px; }
        .p-btn {
            height: 36px;
            padding: 0 22px;
            border: none;
            border-radius: 18px;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .p-btn:hover { background: var(--accent-hover); }
        .p-btn:disabled { opacity: .55; cursor: not-allowed; }
        .p-btn.ghost { background: none; border: 1px solid var(--border); color: var(--text); }
        .p-btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
        .p-btn.small { height: 32px; padding: 0 16px; font-size: 13px; border-radius: 16px; }
        .p-link { font-size: 13px; color: var(--muted); text-decoration: underline; cursor: pointer; }
        .p-link:hover { color: var(--accent); }
        .p-link.danger { color: #d04a4a; }
        .p-link.danger:hover { color: #b03a3a; }

        .p-list { max-width: 960px; margin: 18px auto 40px; padding: 0 16px; }
        .p-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 22px;
            margin-bottom: 16px;
        }
        .p-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .p-title { font-size: 17px; font-weight: 700; }
        .p-chip { font-size: 12px; border-radius: 999px; padding: 2px 10px; border: 1px solid #2e9e5b; color: #2e9e5b; }
        .p-chip.done { border-color: var(--border); color: var(--muted); }
        .p-chip.overdue { border-color: #d04a4a; color: #d04a4a; }
        .p-time { margin-left: auto; font-size: 12px; color: var(--muted); }
        .p-goal { font-size: 13px; color: var(--muted); margin: 6px 0 10px; }
        .p-progress { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
        .p-bar { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
        .p-bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }
        .p-bar i.full { background: #2e9e5b; }
        .p-progress span { font-size: 12px; color: var(--muted); flex-shrink: 0; }

        .p-day { margin-top: 12px; }
        .p-day-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .p-day-head .d-label { font-size: 13px; font-weight: 600; color: var(--accent); }
        .p-day-head .d-date { font-size: 12px; color: var(--muted); }
        .p-task { display: flex; align-items: flex-start; gap: 10px; padding: 7px 10px; border-radius: 8px; font-size: 14px; line-height: 1.6; cursor: pointer; }
        .p-task:hover { background: var(--bubble-ai); }
        .p-task input[type="checkbox"] { margin-top: 4px; width: 15px; height: 15px; accent-color: var(--accent); flex-shrink: 0; cursor: pointer; }
        .p-task.done span { color: var(--muted); text-decoration: line-through; }

        .p-actions { display: flex; align-items: center; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
        .p-urge { display: none; margin-top: 12px; padding: 12px 16px; border-radius: 12px; background: var(--bubble-ai); color: var(--text); font-size: 14px; line-height: 1.8; }
        .p-urge.show { display: block; }
        .p-urge .u-label { font-size: 12px; color: var(--accent); margin-bottom: 4px; }

        .p-empty { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 0; line-height: 2; }
        .p-loading { text-align: center; color: var(--muted); font-size: 14px; padding: 30px 0; }
        .p-note { font-size: 12px; color: var(--muted); margin-top: 8px; }

        #pToast {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            background: var(--text);
            color: var(--bg);
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s;
            z-index: 99;
        }
        #pToast.show { opacity: .95; }
    </style>
</head>
<body>
    <!-- 左侧引导栏 -->
    <div class="sidebar">
        <div class="logo">AGZ</div>
        <a class="module" href="../index.html">首页</a>
        <a class="module" href="页面1.html">ai助手</a>
        <a class="module" href="页面2.html">智能出题</a>
        <a class="module" href="页面3.html">错题复习</a>
        <a class="module" href="页面4.html">学习计划</a>
        <a class="module" href="页面5.html">概念图解</a>

        <!-- 登录状态区（由 script.js 渲染） -->
        <div class="user-area">
            <a class="module" id="loginLink" href="../login.html">登录 / 注册</a>
            <span class="user-name" id="userName" style="display:none"></span>
            <a class="module" id="logoutLink" href="javascript:void(0)" onclick="logout()" style="display:none">退出登录</a>
        </div>
    </div>

    <!-- 内容区 -->
    <div class="box">
        <!-- 顶部标签栏（快捷跳转） -->
        <div class="tab-bar" id="tabBar"></div>

        <!-- 标题 -->
        <div class="p-hero">
            <h1>🎯 学习计划</h1>
            <p>把目标交给 AI 拆解成每天的任务，打卡监督，告别拖延！</p>
        </div>

        <!-- 统计 + 打卡 -->
        <div class="p-stats">
            <div class="p-stat st-fire">
                <div class="num" id="statStreak">0</div>
                <div class="label">🔥 连续打卡（天）</div>
            </div>
            <div class="p-stat">
                <div class="num" id="statDays">0</div>
                <div class="label">累计打卡（天）</div>
            </div>
            <div class="p-stat">
                <div class="num" id="statPlans">0</div>
                <div class="label">进行中计划</div>
            </div>
            <div class="p-stat checkin" id="checkinCard" onclick="doCheckin()" title="点击打卡">
                <div class="num" id="checkinNum">✊</div>
                <div class="label" id="checkinLabel">今日打卡</div>
            </div>
        </div>

        <!-- 新建计划 -->
        <div class="p-form-card">
            <div class="p-form">
                <textarea id="goalInput" placeholder="告诉 AI 你的学习目标，例如：两周内掌握高等数学的极限与导数章节，并做完配套习题"></textarea>
                <div class="p-row">
                    <label>计划天数</label>
                    <input type="number" id="daysInput" value="7" min="1" max="30">
                    <label>每天可用时间</label>
                    <select id="timeInput">
                        <option value="30分钟">30 分钟</option>
                        <option value="1小时" selected>1 小时</option>
                        <option value="2小时">2 小时</option>
                        <option value="3小时">3 小时</option>
                        <option value="4小时以上">4 小时以上</option>
                    </select>
                    <button class="p-btn" id="genBtn" onclick="generatePlan()">✨ AI 生成学习计划</button>
                </div>
                <div class="p-note">AI 会把目标拆解成每天 2~4 个小任务：学新知 → 做练习 → 复盘，最后一天安排综合测试。</div>
            </div>
        </div>

        <!-- 计划列表 -->
        <div class="p-list" id="planList">
            <div class="p-loading">加载中…</div>
        </div>
    </div>

    <!-- 深色/浅色切换按钮 -->
    <button class="theme-btn" id="themeBtn" title="切换深色/浅色模式">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>

    <div id="pToast"></div>

    <script>
        // 本页面信息（供 script.js 的标签栏使用）
        var PAGES = {
            home:  { label: '首页',     href: '../index.html' },
            ai:    { label: 'ai助手',   href: '页面1.html' },
            chuti: { label: '智能出题', href: '页面2.html' },
            m3:    { label: '错题复习', href: '页面3.html' },
            m4:    { label: '学习计划', href: '页面4.html' },
            m5:    { label: '概念图解',    href: '页面5.html' }
        };
        var CURRENT = 'm4';
    </script>
    <script src="../script.js"></script>
    <script>
        // ---------- 学习计划（对接后端 /api/plans、/api/checkin） ----------
        // 未登录直接跳登录页
        var LOGGED = requireLogin('../login.html');

        var PLANS = [];
        var STATS = { streak: 0, today_checked: false, total_days: 0, active_plans: 0 };
        var genBusy = false;

        function el(tag, cls, text) {
            var e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined && text !== null) e.textContent = text;
            return e;
        }

        function fmtTime(t) {
            if (!t) return '';
            try {
                return new Date(String(t).replace(' ', 'T') + 'Z').toLocaleString('zh-CN', { hour12: false });
            } catch (e) { return t; }
        }

        // 计划第 N 天对应的本地日期
        function dayDate(createTime, day) {
            try {
                var d = new Date(String(createTime).replace(' ', 'T') + 'Z');
                d.setDate(d.getDate() + day - 1);
                return (d.getMonth() + 1) + '月' + d.getDate() + '日';
            } catch (e) { return '第' + day + '天'; }
        }

        function toast(msg) {
            var t = document.getElementById('pToast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(function () { t.classList.remove('show'); }, 2200);
        }

        function loadPlans() {
            var list = document.getElementById('planList');
            list.innerHTML = '<div class="p-loading">加载中…</div>';
            api('/api/plans').then(function (res) {
                if (!res.success) {
                    list.innerHTML = '<div class="p-empty">' + (res.message || '加载失败') + '</div>';
                    return;
                }
                PLANS = res.data.plans;
                STATS = res.data.stats;
                renderStats();
                renderPlans();
            }).catch(function () {
                list.innerHTML = '<div class="p-empty">网络错误，请确认后端已启动（localhost:3000）</div>';
            });
        }

        function renderStats() {
            document.getElementById('statStreak').textContent = STATS.streak;
            document.getElementById('statDays').textContent = STATS.total_days;
            document.getElementById('statPlans').textContent = STATS.active_plans;
            var card = document.getElementById('checkinCard');
            if (STATS.today_checked) {
                card.classList.add('done');
                document.getElementById('checkinNum').textContent = '✓';
                document.getElementById('checkinLabel').textContent = '今日已打卡';
            } else {
                card.classList.remove('done');
                document.getElementById('checkinNum').textContent = '✊';
                document.getElementById('checkinLabel').textContent = '今日打卡';
            }
        }

        function renderPlans() {
            var list = document.getElementById('planList');
            list.innerHTML = '';
            var actives = PLANS.filter(function (p) { return p.status === 'active'; });
            var donePlans = PLANS.filter(function (p) { return p.status === 'completed'; });
            if (!PLANS.length) {
                list.innerHTML = '<div class="p-empty">还没有学习计划。<br>在上方告诉 AI 你的目标，生成一份专属计划吧！</div>';
                return;
            }
            actives.forEach(function (p) { list.appendChild(buildPlanCard(p)); });
            if (donePlans.length) {
                var sep = el('div', 'p-empty', '── 已完成的计划 ──');
                sep.style.padding = '20px 0';
                list.appendChild(sep);
                donePlans.forEach(function (p) { list.appendChild(buildPlanCard(p)); });
            }
        }

        function buildPlanCard(p) {
            var card = el('div', 'p-card');
            var isActive = p.status === 'active';

            // 头部
            var head = el('div', 'p-head');
            head.appendChild(el('span', 'p-title', p.title));
            head.appendChild(el('span', 'p-chip' + (isActive ? '' : ' done'), isActive ? '进行中' : '已完成'));
            head.appendChild(el('span', 'p-time', (isActive ? '创建于 ' : '完成于 ') + fmtTime(isActive ? p.create_time : p.complete_time)));
            card.appendChild(head);

            // 目标
            card.appendChild(el('div', 'p-goal', '🎯 ' + p.goal));

            // 进度条
            var prog = el('div', 'p-progress');
            var barWrap = el('div', 'p-bar');
            var bar = document.createElement('i');
            bar.style.width = p.progress.rate + '%';
            if (p.progress.rate === 100) bar.classList.add('full');
            barWrap.appendChild(bar);
            var progText = el('span', p.progress.done + '/' + p.progress.total + ' 任务 · ' + p.progress.rate + '%');
            prog.appendChild(barWrap);
            prog.appendChild(progText);
            card.appendChild(prog);

            // 按天分组任务
            var groups = {};
            p.tasks.forEach(function (t) {
                (groups[t.day] = groups[t.day] || []).push(t);
            });
            Object.keys(groups).map(Number).sort(function (a, b) { return a - b; }).forEach(function (day) {
                var tasks = groups[day];
                var dayBox = el('div', 'p-day');
                var dayHead = el('div', 'p-day-head');
                dayHead.appendChild(el('span', 'd-label', '第 ' + day + ' 天'));
                dayHead.appendChild(el('span', 'd-date', dayDate(p.create_time, day)));
                // 逾期判断：目标日期已过且还有任务没完成
                var target = dayDate(p.create_time, day);
                if (isActive && tasks.some(function (t) { return !t.done; }) && targetDatePassed(p.create_time, day)) {
                    dayHead.appendChild(el('span', 'p-chip overdue', '已逾期'));
                }
                dayBox.appendChild(dayHead);
                tasks.forEach(function (t) {
                    var label = el('label', 'p-task' + (t.done ? ' done' : ''));
                    var cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.checked = t.done;
                    if (!isActive) cb.disabled = true;
                    cb.onchange = function () {
                        toggleTask(p, t, cb);
                    };
                    label.appendChild(cb);
                    label.appendChild(el('span', '', t.content));
                    dayBox.appendChild(label);
                });
                card.appendChild(dayBox);
            });

            // AI 监督提醒气泡
            var urge = el('div', 'p-urge');
            urge.innerHTML = '<div class="u-label">📣 AI 监督教练说</div>';
            var urgeText = document.createElement('div');
            urge.appendChild(urgeText);
            card.appendChild(urge);

            // 操作区
            var actions = el('div', 'p-actions');
            if (isActive) {
                var urgeBtn = el('button', 'p-btn small', '📣 AI 监督我');
                var doneBtn = el('button', 'p-btn ghost small', '✓ 标记完成');
                urgeBtn.onclick = function () {
                    urgeBtn.disabled = true;
                    urgeBtn.textContent = 'AI 监督中…';
                    urgeMe(p, function (msg, ok) {
                        urgeBtn.disabled = false;
                        urgeBtn.textContent = '📣 AI 监督我';
                        if (ok) {
                            urgeText.textContent = msg;
                            urge.classList.add('show');
                        } else {
                            alert(msg);
                        }
                    });
                };
                doneBtn.onclick = function () {
                    if (!confirm('确认这个计划已经完成了吗？')) return;
                    api('/api/plans/' + p.id + '/complete', { method: 'POST' }).then(function (res) {
                        if (res.success) { toast(res.message); loadPlans(); }
                        else alert(res.message || '操作失败');
                    }).catch(function () { alert('网络错误'); });
                };
                actions.appendChild(urgeBtn);
                actions.appendChild(doneBtn);
            }
            var delLink = el('a', 'p-link danger', '删除计划');
            delLink.href = 'javascript:void(0)';
            delLink.onclick = function () {
                if (!confirm('确定删除这个计划吗？删除后不可恢复。')) return;
                api('/api/plans/' + p.id, { method: 'DELETE' }).then(function (res) {
                    if (res.success) { toast(res.message); loadPlans(); }
                    else alert(res.message || '删除失败');
                }).catch(function () { alert('网络错误'); });
            };
            actions.appendChild(delLink);
            card.appendChild(actions);

            return card;
        }

        function targetDatePassed(createTime, day) {
            try {
                var d = new Date(String(createTime).replace(' ', 'T') + 'Z');
                d.setDate(d.getDate() + day - 1);
                var today = new Date();
                var targetMidnight = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                var todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
                return targetMidnight < todayMidnight;
            } catch (e) { return false; }
        }

        function toggleTask(p, t, cb) {
            api('/api/plans/' + p.id + '/toggle-task', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ task_id: t.id })
            }).then(function (res) {
                if (!res.success) {
                    alert(res.message || '操作失败');
                    loadPlans();
                    return;
                }
                t.done = res.data.done;
                // 更新本地进度显示
                var total = p.tasks.length;
                var done = p.tasks.filter(function (x) { return x.done; }).length;
                p.progress = { total: total, done: done, rate: Math.round(done / total * 100) };
                var card = cb.closest('.p-card');
                var bar = card.querySelector('.p-bar i');
                var progText = card.querySelector('.p-progress span');
                bar.style.width = p.progress.rate + '%';
                bar.classList.toggle('full', p.progress.rate === 100);
                progText.textContent = done + '/' + total + ' 任务 · ' + p.progress.rate + '%';
                var label = cb.closest('.p-task');
                label.classList.toggle('done', !!t.done);
                // 打卡状态联动
                STATS.today_checked = res.data.today_checked;
                STATS.streak = res.data.streak;
                renderStats();
                if (t.done) toast('✅ 任务完成，已自动打卡！');
            }).catch(function () {
                alert('网络错误');
                loadPlans();
            });
        }

        function urgeMe(p, cb) {
            api('/api/plans/' + p.id + '/urge', { method: 'POST' }).then(function (res) {
                if (res.success && res.data) {
                    cb(res.data.message, true);
                } else {
                    cb(res.message || '监督提醒生成失败', false);
                }
            }).catch(function () {
                cb('网络错误，请确认后端已启动（localhost:3000）', false);
            });
        }

        function generatePlan() {
            if (genBusy) return;
            var goal = document.getElementById('goalInput').value.trim();
            if (!goal) { alert('请先填写学习目标'); return; }
            var btn = document.getElementById('genBtn');
            genBusy = true;
            btn.disabled = true;
            btn.textContent = 'AI 规划中…';
            api('/api/plans/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    goal: goal,
                    days: document.getElementById('daysInput').value,
                    daily_time: document.getElementById('timeInput').value
                })
            }).then(function (res) {
                genBusy = false;
                btn.disabled = false;
                btn.textContent = '✨ AI 生成学习计划';
                if (res.success) {
                    toast('📋 学习计划已生成！');
                    document.getElementById('goalInput').value = '';
                    loadPlans();
                } else {
                    alert(res.message || '生成失败，请重试');
                }
            }).catch(function () {
                genBusy = false;
                btn.disabled = false;
                btn.textContent = '✨ AI 生成学习计划';
                alert('网络错误，请确认后端已启动（localhost:3000）');
            });
        }

        function doCheckin() {
            if (STATS.today_checked) { toast('今天已经打过卡啦，继续保持！'); return; }
            api('/api/checkin', { method: 'POST' }).then(function (res) {
                if (res.success) {
                    STATS.today_checked = true;
                    STATS.streak = res.data.streak;
                    STATS.total_days = res.data.total_days;
                    renderStats();
                    toast('🔥 打卡成功！连续打卡 ' + res.data.streak + ' 天');
                } else {
                    alert(res.message || '打卡失败');
                }
            }).catch(function () { alert('网络错误'); });
        }

        // 页面加载
        loadPlans();
    </script>
</body>
</html>
