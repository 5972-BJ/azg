<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面1</title>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* 本页专属：聊天界面样式 */
        .above-box {
            position: fixed;
            top: 56px;
            bottom: 70px;
            left: 200px;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow-y: auto;
            padding: 15px;
        }
        .msg {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }
        .bubble {
            max-width: 70%;
            padding: 10px 14px;
            background: var(--bubble);
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }
        .footer {
            position: fixed;
            bottom: 0;
            left: 200px;
            right: 80px;
            height: 60px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 0 20px;
            font-size: 16px;
            outline: none;
            color: var(--text);
        }
        .footer:focus { border-color: var(--accent); }
        .send-btn {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 60px;
            height: 40px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }
        .send-btn:hover { background: var(--accent-hover); }
        /* AI 回复气泡（靠左、浅色） */
        .msg.left { justify-content: flex-start; }
        .bubble.ai { background: var(--bubble-ai); }
        .bubble.err { background: #fdeaea; color: #c0392b; }
        .typing { color: var(--muted); font-size: 13px; padding: 4px 2px; }
        .send-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>
    <!-- 左侧引导栏 -->
    <div class="sidebar">
        <div class="logo">AGZ</div>
        <a class="module" href="../index.html">首页</a>
        <a class="module" href="页面1.html">ai助手</a>
        <a class="module" href="页面2.html">智能出题</a>
        <a class="module" href="页面3.html">错题复习</a>
        <a class="module" href="页面4.html">学习计划</a>
        <a class="module" href="页面5.html">概念图解</a>

        <!-- 登录状态区（由 script.js 渲染） -->
        <div class="user-area">
            <a class="module" id="loginLink" href="../login.html">登录 / 注册</a>
            <span class="user-name" id="userName" style="display:none"></span>
            <a class="module" id="logoutLink" href="javascript:void(0)" onclick="logout()" style="display:none">退出登录</a>
        </div>
    </div>

    <!-- 内容区 -->
    <div class="box">
        <!-- 顶部标签栏（快捷跳转） -->
        <div class="tab-bar" id="tabBar"></div>
    </div>

    <!-- 聊天区域 -->
    <div class="above-box" id="chatArea"></div>
    <input class="footer" id="footer" type="text" placeholder="请输入内容...">
    <button class="send-btn" onclick="send()">发送</button>

    <!-- 深色/浅色切换按钮 -->
    <button class="theme-btn" id="themeBtn" title="切换深色/浅色模式">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>

    <script>
        // 本页面信息（供 script.js 的标签栏使用）
        var PAGES = {
            home:  { label: '首页',    href: '../index.html' },
            ai:    { label: 'ai助手',  href: '页面1.html' },
            chuti: { label: '智能出题', href: '页面2.html' },
            m3:    { label: '错题复习',   href: '页面3.html' },
            m4:    { label: '学习计划',   href: '页面4.html' },
            m5:    { label: '概念图解',   href: '页面5.html' }
        };
        var CURRENT = 'ai';
    </script>
    <script src="../script.js"></script>
    <script>
        // ---------- 聊天功能（对接后端 /api/chat） ----------
        var chatArea = document.getElementById('chatArea');

        // 追加一条消息气泡
        // type: 'user' 用户(靠右) | 'ai' AI回复(靠左) | 'err' 错误提示(靠左)
        function appendMsg(text, type) {
            var msg = document.createElement('div');
            msg.className = 'msg' + (type === 'user' ? '' : ' left');
            var bubble = document.createElement('div');
            bubble.className = 'bubble' + (type === 'user' ? '' : (type === 'err' ? ' err' : ' ai'));
            bubble.textContent = text;
            msg.appendChild(bubble);
            chatArea.appendChild(msg);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // 追加"正在思考"占位，返回可删除的元素
        function appendTyping() {
            var el = document.createElement('div');
            el.className = 'typing';
            el.textContent = 'AI 正在思考…';
            chatArea.appendChild(el);
            chatArea.scrollTop = chatArea.scrollHeight;
            return el;
        }

        // 发送消息
        function send() {
            var user = getUser();
            if (!user) { location.href = '../login.html'; return; }
            var input = document.getElementById('footer');
            var btn = document.querySelector('.send-btn');
            var val = input.value.trim();
            if (!val || btn.disabled) return;

            appendMsg(val, 'user');
            input.value = '';
            var typing = appendTyping();
            btn.disabled = true;

            api('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: user.id, message: val })
            }).then(function (res) {
                typing.remove();
                btn.disabled = false;
                if (res.success && res.data) {
                    appendMsg(res.data.reply, 'ai');
                    // 保存对话记录（失败不打断聊天）
                    api('/api/chat/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: user.id,
                            question: val,
                            answer: res.data.reply,
                            mind_map: res.data.mindmap || null,
                            image_url: res.data.image || null
                        })
                    }).catch(function () {});
                } else {
                    appendMsg('出错了：' + (res.message || '未知错误'), 'err');
                }
            }).catch(function () {
                typing.remove();
                btn.disabled = false;
                appendMsg('网络错误，请确认后端已启动（localhost:3000）', 'err');
            });
        }

        // 加载历史对话
        function loadHistory() {
            var user = getUser();
            if (!user) return;
            api('/api/chat/history?user_id=' + user.id).then(function (res) {
                if (!res.success || !res.data || !res.data.length) return;
                // 接口按时间倒序返回，反转成时间正序展示
                res.data.slice().reverse().forEach(function (rec) {
                    appendMsg(rec.question, 'user');
                    appendMsg(rec.answer, 'ai');
                });
            }).catch(function () {});
        }

        // 未登录直接跳登录页
        var LOGGED = requireLogin('../login.html');
        if (LOGGED) loadHistory();

        // 按回车也能发送
        document.getElementById('footer').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') send();
        });
    </script>
</body>
</html>
