<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面2</title>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* 本页专属：搜索框样式 */
        .search-box {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 40px;
            gap: 10px;
        }
        .search-input {
            width: 720px;
            max-width: 70%;
            height: 54px;
            border: 1px solid var(--border);
            border-radius: 27px;
            padding: 0 24px;
            font-size: 16px;
            background: var(--card-bg);
            color: var(--text);
            outline: none;
        }
        .search-input:focus { border-color: var(--accent); }
        .search-btn {
            height: 54px;
            padding: 0 28px;
            border: none;
            border-radius: 27px;
            background: var(--accent);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        .search-btn:hover { background: var(--accent-hover); }
        .search-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* 本页专属：题目列表样式 */
        .question-list {
            max-width: 860px;
            margin: 28px auto 40px;
            padding: 0 16px;
        }
        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 22px;
            margin-bottom: 16px;
        }
        .q-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .q-index {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .q-type {
            font-size: 12px;
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 999px;
            padding: 2px 10px;
        }
        .q-text {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .q-options {
            list-style: none;
            padding: 0;
            margin: 0 0 10px;
        }
        .q-options li {
            font-size: 14px;
            line-height: 1.6;
            padding: 8px 12px;
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
            border: 1px solid transparent;
        }
        .q-options li:hover { background: var(--bubble-ai); }
        .q-options li.selected { border-color: var(--accent); background: var(--bubble-ai); }
        .q-options li.correct { background: rgba(46,158,91,.14); color: #2e9e5b; font-weight: 600; }
        .q-options li.wrong { background: rgba(208,74,74,.14); color: #d04a4a; }
        .q-options li.locked { cursor: default; }
        .q-options li.locked:hover { background: transparent; }
        .q-answer {
            font-size: 13px;
            color: #2e9e5b;
            margin-bottom: 4px;
        }
        .q-explain {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6;
        }

        /* 本页专属：交互作答样式 */
        .q-status {
            margin-left: auto;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--muted);
        }
        .q-status.st-ok { color: #2e9e5b; border-color: #2e9e5b; }
        .q-status.st-bad { color: #d04a4a; border-color: #d04a4a; }
        .q-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 12px;
        }
        .q-submit-btn {
            height: 36px;
            padding: 0 20px;
            border: none;
            border-radius: 18px;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .q-submit-btn:hover { background: var(--accent-hover); }
        .q-submit-btn:disabled { opacity: .55; cursor: not-allowed; }
        .q-reveal-link {
            font-size: 13px;
            color: var(--muted);
            cursor: pointer;
            text-decoration: underline;
        }
        .q-reveal-link:hover { color: var(--accent); }
        .q-answer-input {
            width: 100%;
            min-height: 88px;
            margin-top: 12px;
            padding: 10px 12px;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.6;
            outline: none;
            resize: vertical;
            font-family: inherit;
        }
        .q-answer-input:focus { border-color: var(--accent); }
        .q-feedback {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.7;
            background: var(--bubble-ai);
            color: var(--text);
        }
        .q-feedback.fb-ok { background: rgba(46,158,91,.1); color: #2e9e5b; }
        .q-feedback.fb-bad { background: rgba(208,74,74,.1); color: #d04a4a; }
        .q-mistake-note { display: none; margin-top: 10px; font-size: 13px; color: var(--accent); }
        .q-reveal-area { display: none; margin-top: 10px; }
        .score-bar {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 20px;
            margin-bottom: 16px;
            font-size: 14px;
            text-align: center;
        }
        .q-loading, .q-empty {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            padding: 30px 0;
        }

        /* 本页专属：历史记录样式 */
        .history-bar {
            max-width: 860px;
            margin: 18px auto 0;
            padding: 0 16px;
            display: flex;
            justify-content: center;
        }
        .history-btn {
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            cursor: pointer;
            font-size: 13px;
        }
        .history-btn:hover { border-color: var(--accent); color: var(--accent); }
        .history-panel {
            max-width: 860px;
            margin: 16px auto 0;
            padding: 0 16px;
        }
        .history-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
        }
        .history-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 600;
        }
        .history-close {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 15px;
            cursor: pointer;
        }
        .history-close:hover { color: var(--text); }
        .history-list {
            max-height: 340px;
            overflow-y: auto;
            padding: 8px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }
        .history-item:hover { background: var(--bubble-ai); }
        .history-keyword { color: var(--accent); }
        .history-time { color: var(--muted); font-size: 12px; flex-shrink: 0; }
    </style>
</head>
<body>
    <!-- 左侧引导栏 -->
    <div class="sidebar">
        <div class="logo">AGZ</div>
        <a class="module" href="../index.html">首页</a>
        <a class="module" href="页面1.html">ai助手</a>
        <a class="module" href="页面2.html">智能出题</a>
        <a class="module" href="页面3.html">错题复习</a>
        <a class="module" href="页面4.html">学习计划</a>
        <a class="module" href="页面5.html">概念图解</a>

        <!-- 登录状态区（由 script.js 渲染） -->
        <div class="user-area">
            <a class="module" id="loginLink" href="../login.html">登录 / 注册</a>
            <span class="user-name" id="userName" style="display:none"></span>
            <a class="module" id="logoutLink" href="javascript:void(0)" onclick="logout()" style="display:none">退出登录</a>
        </div>
    </div>

    <!-- 内容区 -->
    <div class="box">
        <!-- 顶部标签栏（快捷跳转） -->
        <div class="tab-bar" id="tabBar"></div>

        <!-- 顶部搜索框 -->
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="输入知识点，AI 帮你出题">
            <button class="search-btn" id="searchBtn" onclick="generate()">搜索</button>
        </div>

        <!-- 历史记录入口 -->
        <div class="history-bar">
            <button class="history-btn" id="historyBtn" onclick="toggleHistory()">📜 查看历史记录</button>
        </div>

        <!-- 历史记录面板 -->
        <div class="history-panel" id="historyPanel" style="display:none">
            <div class="history-card">
                <div class="history-head">
                    <span>出题历史</span>
                    <button class="history-close" onclick="toggleHistory(false)" title="关闭">✕</button>
                </div>
                <div class="history-list" id="historyList">
                    <div class="q-loading">加载中…</div>
                </div>
            </div>
        </div>

        <!-- 题目结果列表 -->
        <div class="question-list" id="questionList"></div>
    </div>

    <!-- 深色/浅色切换按钮 -->
    <button class="theme-btn" id="themeBtn" title="切换深色/浅色模式">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>

    <script>
        // 本页面信息（供 script.js 的标签栏使用）
        var PAGES = {
            home:  { label: '首页',    href: '../index.html' },
            ai:    { label: 'ai助手',  href: '页面1.html' },
            chuti: { label: '智能出题', href: '页面2.html' },
            m3:    { label: '错题复习',   href: '页面3.html' },
            m4:    { label: '学习计划',   href: '页面4.html' },
            m5:    { label: '概念图解',   href: '页面5.html' }
        };
        var CURRENT = 'chuti';
    </script>
    <script src="../script.js"></script>
    <script>
        // ---------- 智能出题（对接后端 /api/questions） ----------
        // 未登录直接跳登录页
        var LOGGED = requireLogin('../login.html');

        function generate() {
            if (!getToken()) { location.href = '../login.html'; return; }
            var input = document.getElementById('searchInput');
            var btn = document.getElementById('searchBtn');
            var list = document.getElementById('questionList');
            var keyword = input.value.trim();
            if (!keyword || btn.disabled) return;

            CURRENT_KEYWORD = keyword;
            list.innerHTML = '<div class="q-loading">AI 正在出题，请稍候…</div>';
            btn.disabled = true;

            api('/api/questions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ keyword: keyword })
            }).then(function (res) {
                btn.disabled = false;
                if (res.success && res.data && res.data.length) {
                    renderQuestions(res.data);
                } else {
                    list.innerHTML = '<div class="q-empty">' + (res.message || '生成失败，请重试') + '</div>';
                }
            }).catch(function () {
                btn.disabled = false;
                list.innerHTML = '<div class="q-empty">网络错误，请确认后端已启动（localhost:3000）</div>';
            });
        }

        // ---------- 交互作答 ----------
        var LETTERS = ['A', 'B', 'C', 'D'];
        var SCORE = { total: 0, answered: 0, correct: 0 };
        var scoreBarEl = null;
        var CURRENT_KEYWORD = '';   // 当前题目对应的知识点（错题收录用）

        function el(tag, cls, text) {
            var e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined && text !== null) e.textContent = text;
            return e;
        }

        // 从参考答案里提取选项字母（A~D）
        function answerLetter(ref) {
            var m = String(ref || '').match(/[A-Da-d]/);
            return m ? m[0].toUpperCase() : null;
        }

        function updateScore() {
            scoreBarEl.textContent = '📊 作答进度：已答 ' + SCORE.answered + '/' + SCORE.total +
                ' · 答对 ' + SCORE.correct + ' · 得分 ' + SCORE.correct + '/' + SCORE.total;
        }

        // 答错的题自动加入错题本（失败静默处理，不影响做题）
        function saveMistake(q, wrongAnswer, noteEl) {
            api('/api/mistakes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    keyword: CURRENT_KEYWORD || '',
                    type: q.type || '',
                    question: q.question,
                    options: q.options || null,
                    answer: q.answer || '',
                    explanation: q.explanation || '',
                    wrong_answer: wrongAnswer
                })
            }).then(function (res) {
                if (res.success && noteEl) noteEl.style.display = 'block';
            }).catch(function () { /* 静默失败 */ });
        }

        // 调用后端 AI 批改接口
        function aiGrade(q, userAnswer, cb) {
            api('/api/questions/grade', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    question: q.question,
                    reference_answer: q.answer || '',
                    user_answer: userAnswer
                })
            }).then(function (res) {
                if (res.success && res.data) {
                    cb(res.data, '');
                } else {
                    cb(null, res.message || 'AI 批改失败，请重试');
                }
            }).catch(function () {
                cb(null, '网络错误，请确认后端已启动（localhost:3000）');
            });
        }

        function renderQuestions(questions) {
            var list = document.getElementById('questionList');
            list.innerHTML = '';
            SCORE = { total: questions.length, answered: 0, correct: 0 };
            scoreBarEl = el('div', 'score-bar');
            updateScore();
            list.appendChild(scoreBarEl);
            questions.forEach(function (q, i) {
                list.appendChild(buildCard(q, i));
            });
        }

        function buildCard(q, i) {
            var card = el('div', 'question-card');
            var done = false;
            var input = null;

            // 头部：序号 + 类型 + 作答状态
            var head = el('div', 'q-head');
            head.appendChild(el('span', 'q-index', String(i + 1)));
            if (q.type) head.appendChild(el('span', 'q-type', q.type));
            var status = el('span', 'q-status', '未作答');
            head.appendChild(status);
            card.appendChild(head);

            // 题干
            card.appendChild(el('div', 'q-text', q.question));

            // 答案 + 解析（默认隐藏，作答后展示）
            var revealArea = el('div', 'q-reveal-area');
            if (q.answer) revealArea.appendChild(el('div', 'q-answer', '答案：' + q.answer));
            if (q.explanation) revealArea.appendChild(el('div', 'q-explain', '解析：' + q.explanation));
            card.appendChild(revealArea);

            // AI 批改点评（默认隐藏）
            var feedback = el('div', 'q-feedback');
            feedback.style.display = 'none';
            card.appendChild(feedback);

            // 错题收录提示（答错时显示）
            var mistakeNote = el('div', 'q-mistake-note', '📕 已加入错题本，可到「错题复习」巩固');
            card.appendChild(mistakeNote);

            // 操作区
            var actions = el('div', 'q-actions');
            var submit = el('button', 'q-submit-btn');
            var revealLink = el('a', 'q-reveal-link', '我不会，直接看答案');
            revealLink.href = 'javascript:void(0)';
            actions.appendChild(submit);
            actions.appendChild(revealLink);
            card.appendChild(actions);

            var optionsEls = [];

            function setStatus(text, cls) {
                status.textContent = text;
                status.className = 'q-status' + (cls ? ' ' + cls : '');
            }

            // 锁定交互并展示答案
            function finish(correct, aiComment, wrongAnswer) {
                done = true;
                setStatus(correct ? '✓ 正确' : '✗ 错误', correct ? 'st-ok' : 'st-bad');
                revealArea.style.display = 'block';
                if (aiComment) {
                    feedback.textContent = 'AI 点评：' + aiComment;
                    feedback.className = 'q-feedback ' + (correct ? 'fb-ok' : 'fb-bad');
                    feedback.style.display = 'block';
                }
                SCORE.answered += 1;
                if (correct) SCORE.correct += 1;
                updateScore();
                submit.disabled = true;
                if (input) input.disabled = true;
                revealLink.style.display = 'none';
                if (!correct && wrongAnswer !== undefined && wrongAnswer !== null) {
                    saveMistake(q, wrongAnswer, mistakeNote);
                }
            }

            // 放弃作答，直接看答案（不计分）
            function revealOnly() {
                done = true;
                setStatus('已查看答案');
                revealArea.style.display = 'block';
                submit.disabled = true;
                if (input) input.disabled = true;
                var refLetter = (q.options && q.options.length) ? answerLetter(q.answer) : null;
                if (refLetter && optionsEls.length) {
                    optionsEls.forEach(function (o) { o.classList.add('locked'); });
                    var idx = LETTERS.indexOf(refLetter);
                    if (idx >= 0 && idx < optionsEls.length) optionsEls[idx].classList.add('correct');
                }
                revealLink.style.display = 'none';
            }
            revealLink.onclick = function () { if (!done) revealOnly(); };

            if (q.options && q.options.length) {
                // ---------- 选择题：点选 + 提交 ----------
                var options = el('ul', 'q-options');
                q.options.forEach(function (opt, j) {
                    var li = el('li', '', LETTERS[j] + '. ' + opt);
                    li.onclick = function () {
                        if (done) return;
                        optionsEls.forEach(function (o) { o.classList.remove('selected'); });
                        li.classList.add('selected');
                        submit.disabled = false;
                    };
                    optionsEls.push(li);
                    options.appendChild(li);
                });
                card.insertBefore(options, actions);

                submit.textContent = '提交答案';
                submit.disabled = true;
                submit.onclick = function () {
                    if (done || submit.disabled) return;
                    var chosen = -1;
                    optionsEls.forEach(function (o, j) {
                        if (o.classList.contains('selected')) chosen = j;
                    });
                    if (chosen < 0) return;

                    var refLetter = answerLetter(q.answer);
                    if (refLetter) {
                        // 本地判分：标绿正确项、标红错选项
                        var correctIdx = LETTERS.indexOf(refLetter);
                        optionsEls.forEach(function (o) { o.classList.add('locked'); });
                        if (correctIdx >= 0 && correctIdx < optionsEls.length) {
                            optionsEls[correctIdx].classList.add('correct');
                        }
                        if (chosen !== correctIdx) optionsEls[chosen].classList.add('wrong');
                        finish(chosen === correctIdx, null, LETTERS[chosen] + '. ' + q.options[chosen]);
                    } else {
                        // 参考答案没有字母（旧数据），交给 AI 判
                        submit.disabled = true;
                        submit.textContent = 'AI 批改中…';
                        aiGrade(q, LETTERS[chosen] + '. ' + q.options[chosen], function (data, msg) {
                            if (!data) {
                                alert(msg || 'AI 批改失败，请重试');
                                submit.disabled = false;
                                submit.textContent = '提交答案';
                                return;
                            }
                            optionsEls.forEach(function (o) { o.classList.add('locked'); });
                            optionsEls[chosen].classList.add(data.correct ? 'correct' : 'wrong');
                            finish(data.correct, data.comment, LETTERS[chosen] + '. ' + q.options[chosen]);
                        });
                    }
                };
            } else {
                // ---------- 简答/应用题：输入 + AI 批改 ----------
                input = el('textarea', 'q-answer-input');
                input.placeholder = '在这里输入你的答案…';
                card.insertBefore(input, actions);

                submit.textContent = '提交批改';
                submit.onclick = function () {
                    if (done || submit.disabled) return;
                    var ans = input.value.trim();
                    if (!ans) { alert('请先输入你的答案'); return; }
                    submit.disabled = true;
                    submit.textContent = 'AI 批改中…';
                    input.disabled = true;
                    aiGrade(q, ans, function (data, msg) {
                        if (!data) {
                            alert(msg || 'AI 批改失败，请重试');
                            submit.disabled = false;
                            submit.textContent = '提交批改';
                            input.disabled = false;
                            return;
                        }
                        finish(data.correct, data.comment, ans);
                    });
                };
            }

            return card;
        }

        // ---------- 出题历史 ----------
        // SQLite 存的是 UTC 时间，转成当地显示
        function fmtTime(t) {
            try {
                return new Date(String(t).replace(' ', 'T') + 'Z').toLocaleString('zh-CN', { hour12: false });
            } catch (e) {
                return t;
            }
        }

        // 打开/关闭历史面板（不传参则切换）
        function toggleHistory(force) {
            var panel = document.getElementById('historyPanel');
            var open = (typeof force === 'boolean') ? force : (panel.style.display === 'none');
            panel.style.display = open ? 'block' : 'none';
            if (open) loadHistory();
        }

        function loadHistory() {
            var list = document.getElementById('historyList');
            list.innerHTML = '<div class="q-loading">加载中…</div>';
            api('/api/questions/history').then(function (res) {
                if (!res.success) {
                    list.innerHTML = '<div class="q-empty">' + res.message + '</div>';
                    return;
                }
                if (!res.data || !res.data.length) {
                    list.innerHTML = '<div class="q-empty">暂无出题记录，先去出一道题吧</div>';
                    return;
                }
                list.innerHTML = '';
                res.data.forEach(function (rec) {
                    var item = document.createElement('div');
                    item.className = 'history-item';
                    var kw = document.createElement('span');
                    kw.className = 'history-keyword';
                    kw.textContent = '📝 ' + rec.keyword;
                    var time = document.createElement('span');
                    time.className = 'history-time';
                    time.textContent = fmtTime(rec.create_time);
                    item.appendChild(kw);
                    item.appendChild(time);
                    item.onclick = function () {
                        document.getElementById('searchInput').value = rec.keyword;
                        CURRENT_KEYWORD = rec.keyword;
                        if (rec.questions && rec.questions.length) {
                            renderQuestions(rec.questions);
                        } else {
                            document.getElementById('questionList').innerHTML = '<div class="q-empty">该记录没有题目内容</div>';
                        }
                        toggleHistory(false);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    };
                    list.appendChild(item);
                });
            }).catch(function () {
                list.innerHTML = '<div class="q-empty">网络错误，请确认后端已启动（localhost:3000）</div>';
            });
        }

        // 搜索框按回车也能出题
        document.getElementById('searchInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') generate();
        });
    </script>
</body>
</html>
