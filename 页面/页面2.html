<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面2</title>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* 本页专属：搜索框样式 */
        .search-box {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 40px;
            gap: 10px;
        }
        .search-input {
            width: 720px;
            max-width: 70%;
            height: 54px;
            border: 1px solid var(--border);
            border-radius: 27px;
            padding: 0 24px;
            font-size: 16px;
            background: var(--card-bg);
            color: var(--text);
            outline: none;
        }
        .search-input:focus { border-color: var(--accent); }
        .search-btn {
            height: 54px;
            padding: 0 28px;
            border: none;
            border-radius: 27px;
            background: var(--accent);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        .search-btn:hover { background: var(--accent-hover); }
        .search-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* 本页专属：题目列表样式 */
        .question-list {
            max-width: 860px;
            margin: 28px auto 40px;
            padding: 0 16px;
        }
        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 22px;
            margin-bottom: 16px;
        }
        .q-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .q-index {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .q-type {
            font-size: 12px;
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 999px;
            padding: 2px 10px;
        }
        .q-text {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .q-options {
            list-style: none;
            padding: 0;
            margin: 0 0 10px;
        }
        .q-options li {
            font-size: 14px;
            line-height: 1.6;
            padding: 6px 12px;
            border-radius: 8px;
            color: var(--text);
        }
        .q-options li:hover { background: var(--bubble-ai); }
        .q-answer {
            font-size: 13px;
            color: #2e9e5b;
            margin-bottom: 4px;
        }
        .q-explain {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6;
        }
        .q-loading, .q-empty {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            padding: 30px 0;
        }
    </style>
</head>
<body>
    <!-- 左侧引导栏 -->
    <div class="sidebar">
        <div class="logo">AGZ</div>
        <a class="module" href="../index.html">首页</a>
        <a class="module" href="页面1.html">ai助手</a>
        <a class="module" href="页面2.html">智能出题</a>
        <a class="module" href="页面3.html">模块3</a>
        <a class="module" href="页面4.html">模块4</a>
        <a class="module" href="页面5.html">模块5</a>

        <!-- 登录状态区（由 script.js 渲染） -->
        <div class="user-area">
            <a class="module" id="loginLink" href="../login.html">登录 / 注册</a>
            <span class="user-name" id="userName" style="display:none"></span>
            <a class="module" id="logoutLink" href="javascript:void(0)" onclick="logout()" style="display:none">退出登录</a>
        </div>
    </div>

    <!-- 内容区 -->
    <div class="box">
        <!-- 顶部标签栏（快捷跳转） -->
        <div class="tab-bar" id="tabBar"></div>

        <!-- 顶部搜索框 -->
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="输入知识点，AI 帮你出题">
            <button class="search-btn" id="searchBtn" onclick="generate()">搜索</button>
        </div>

        <!-- 题目结果列表 -->
        <div class="question-list" id="questionList"></div>
    </div>

    <!-- 深色/浅色切换按钮 -->
    <button class="theme-btn" id="themeBtn" title="切换深色/浅色模式">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>

    <script>
        // 本页面信息（供 script.js 的标签栏使用）
        var PAGES = {
            home:  { label: '首页',    href: '../index.html' },
            ai:    { label: 'ai助手',  href: '页面1.html' },
            chuti: { label: '智能出题', href: '页面2.html' },
            m3:    { label: '模块3',   href: '页面3.html' },
            m4:    { label: '模块4',   href: '页面4.html' },
            m5:    { label: '模块5',   href: '页面5.html' }
        };
        var CURRENT = 'chuti';
    </script>
    <script src="../script.js"></script>
    <script>
        // ---------- 智能出题（对接后端 /api/questions） ----------
        function generate() {
            var input = document.getElementById('searchInput');
            var btn = document.getElementById('searchBtn');
            var list = document.getElementById('questionList');
            var keyword = input.value.trim();
            if (!keyword || btn.disabled) return;

            list.innerHTML = '<div class="q-loading">正在生成题目…</div>';
            btn.disabled = true;

            api('/api/questions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ keyword: keyword })
            }).then(function (res) {
                btn.disabled = false;
                if (res.success && res.data && res.data.length) {
                    renderQuestions(res.data);
                } else {
                    list.innerHTML = '<div class="q-empty">' + (res.message || '生成失败，请重试') + '</div>';
                }
            }).catch(function () {
                btn.disabled = false;
                list.innerHTML = '<div class="q-empty">网络错误，请确认后端已启动（localhost:3000）</div>';
            });
        }

        function renderQuestions(questions) {
            var list = document.getElementById('questionList');
            list.innerHTML = '';
            questions.forEach(function (q, i) {
                var card = document.createElement('div');
                card.className = 'question-card';

                var head = document.createElement('div');
                head.className = 'q-head';
                var index = document.createElement('span');
                index.className = 'q-index';
                index.textContent = i + 1;
                head.appendChild(index);
                if (q.type) {
                    var type = document.createElement('span');
                    type.className = 'q-type';
                    type.textContent = q.type;
                    head.appendChild(type);
                }
                card.appendChild(head);

                var text = document.createElement('div');
                text.className = 'q-text';
                text.textContent = q.question;
                card.appendChild(text);

                if (q.options && q.options.length) {
                    var options = document.createElement('ul');
                    options.className = 'q-options';
                    var letters = ['A', 'B', 'C', 'D'];
                    q.options.forEach(function (opt, j) {
                        var li = document.createElement('li');
                        li.textContent = letters[j] + '. ' + opt;
                        options.appendChild(li);
                    });
                    card.appendChild(options);
                }

                if (q.answer) {
                    var answer = document.createElement('div');
                    answer.className = 'q-answer';
                    answer.textContent = '答案：' + q.answer;
                    card.appendChild(answer);
                }
                if (q.explanation) {
                    var explain = document.createElement('div');
                    explain.className = 'q-explain';
                    explain.textContent = '解析：' + q.explanation;
                    card.appendChild(explain);
                }

                list.appendChild(card);
            });
        }

        // 搜索框按回车也能出题
        document.getElementById('searchInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') generate();
        });
    </script>
</body>
</html>
