<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGZ</title>
    <script>
        // 打开页面时先应用上次保存的主题，避免闪烁
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 左侧引导栏 -->
    <div class="sidebar">
        <div class="logo">AGZ</div>
        <a class="module" href="页面/页面1.html">ai助手</a>
        <a class="module" href="页面/页面2.html">智能出题</a>
        <a class="module" href="页面/页面3.html">错题复习</a>
        <a class="module" href="页面/页面4.html">学习计划</a>
        <a class="module" href="页面/页面5.html">概念图解</a>
        <a class="module" href="拍题/">拍题学习</a>

        <!-- 登录状态区（由 script.js 渲染） -->
        <div class="user-area">
            <a class="module" id="loginLink" href="login.html">登录 / 注册</a>
            <span class="user-name" id="userName" style="display:none"></span>
            <a class="module" id="logoutLink" href="javascript:void(0)" onclick="logout()" style="display:none">退出登录</a>
        </div>
    </div>

    <!-- 右侧内容区 -->
    <div class="box">
        <!-- 顶部标签栏（快捷跳转） -->
        <div class="tab-bar" id="tabBar"></div>

        <!-- 欢迎区 -->
        <div class="hero">
            <h1>欢迎使用 <span>AGZ</span></h1>
            <p>基于大模型的个性化 AI 学习助手</p>
        </div>
        <div class="cards">
            <a class="card-link" href="页面/页面1.html">
                <div class="card-title">💬 ai助手</div>
                <div class="card-desc">有问题随时问，AI 助手为你解答，并保留历史对话。</div>
            </a>
            <a class="card-link" href="页面/页面2.html">
                <div class="card-title">📝 智能出题</div>
                <div class="card-desc">输入知识点，AI 自动生成题目助你巩固练习。</div>
            </a>
            <a class="card-link" href="页面/页面3.html">
                <div class="card-title">📕 错题复习</div>
                <div class="card-desc">答错的题自动收录，反复练习直到掌握。</div>
            </a>
            <a class="card-link" href="页面/页面4.html">
                <div class="card-title">🎯 学习计划</div>
                <div class="card-desc">AI 帮你拆解目标，打卡监督告别拖延。</div>
            </a>
            <a class="card-link" href="页面/页面5.html">
                <div class="card-title">🧠 概念图解</div>
                <div class="card-desc">复杂概念变通俗类比 + 交互知识图谱，一点就懂。</div>
            </a>
            <a class="card-link" href="login.html">
                <div class="card-title">🔐 登录 / 注册</div>
                <div class="card-desc">登录后可使用完整功能并保存学习记录。</div>
            </a>
        </div>
    </div>

    <!-- 深色/浅色切换按钮 -->
    <button class="theme-btn" id="themeBtn" title="切换深色/浅色模式">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>

    <script>
        // 本页面信息（供 script.js 的标签栏使用）
        var PAGES = {
            home:  { label: '首页',    href: 'index.html' },
            ai:    { label: 'ai助手',  href: '页面/页面1.html' },
            chuti: { label: '智能出题', href: '页面/页面2.html' },
            m3:    { label: '错题复习',   href: '页面/页面3.html' },
            m4:    { label: '学习计划',   href: '页面/页面4.html' },
            m5:    { label: '概念图解',   href: '页面/页面5.html' }
        };
        var CURRENT = null;  // 首页本身不显示成标签
    </script>
    <script src="script.js"></script>
</body>
</html>
