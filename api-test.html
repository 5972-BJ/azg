<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AZG · API 测试面板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; padding: 24px; }
    h1 { font-size: 20px; margin-bottom: 16px; color: #e94560; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background: #16213e; border-radius: 10px; padding: 20px; border: 1px solid #0f3460; }
    .card h2 { font-size: 15px; margin-bottom: 12px; color: #53a8b6; }
    .card label { display: block; font-size: 12px; color: #999; margin: 8px 0 3px; }
    .card input, .card textarea { width: 100%; padding: 8px 10px; background: #0f3460; border: 1px solid #1a508b; border-radius: 5px; color: #fff; font-size: 13px; resize: vertical; }
    .card button { margin-top: 10px; width: 100%; padding: 9px; background: #e94560; border: none; border-radius: 5px; color: #fff; font-weight: bold; cursor: pointer; font-size: 13px; }
    .card button:hover { background: #ff6b6b; }
    .card button:disabled { opacity: .4; cursor: not-allowed; }
    pre { margin-top: 10px; background: #0d1117; padding: 10px; border-radius: 5px; font-size: 11px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; color: #7ee787; }
    .full { grid-column: 1 / -1; }
    .token-box { background: #0d1117; padding: 10px; border-radius: 5px; font-size: 11px; word-break: break-all; color: #d2a8ff; max-height: 60px; overflow-y: auto; margin-top: 8px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row span { color: #999; font-size: 12px; white-space: nowrap; }
  </style>
</head>
<body>
<h1>🧪 AZG — API 测试面板</h1>

<div class="grid">
  <!-- 注册 -->
  <div class="card">
    <h2>📝 注册 POST /api/register</h2>
    <label>用户名</label><input id="reg-username" placeholder="alice" value="alice">
    <label>邮箱</label><input id="reg-email" type="email" placeholder="alice@test.com" value="alice@test.com">
    <label>密码</label><input id="reg-password" type="password" placeholder="至少6位" value="abc123">
    <button onclick="doRegister()">注册</button>
    <pre id="reg-result">等待操作...</pre>
  </div>

  <!-- 登录 -->
  <div class="card">
    <h2>🔑 登录 POST /api/login</h2>
    <label>用户名</label><input id="login-username" placeholder="alice" value="alice">
    <label>密码</label><input id="login-password" type="password" placeholder="输入密码" value="abc123">
    <button onclick="doLogin()">登录</button>
    <pre id="login-result">等待操作...</pre>
    <div class="token-box" id="token-display">Token: 未获取</div>
  </div>

  <!-- 聊天 -->
  <div class="card">
    <h2>💬 聊天 POST /api/chat</h2>
    <label>用户 ID</label><input id="chat-userid" type="number" value="1">
    <label>消息</label><textarea id="chat-message" rows="2" placeholder="输入你的问题...">什么是机器学习？</textarea>
    <button onclick="doChat()">发送</button>
    <pre id="chat-result">等待操作...</pre>
  </div>

  <!-- 反馈 -->
  <div class="card">
    <h2>📋 反馈 POST /api/feedback</h2>
    <label>姓名</label><input id="fb-name" placeholder="你的名字" value="张三">
    <label>邮箱</label><input id="fb-email" placeholder="可选" value="zhang@test.com">
    <label>内容</label><textarea id="fb-content" rows="2" placeholder="反馈内容...">网站很棒！</textarea>
    <button onclick="doFeedback()">提交反馈</button>
    <pre id="fb-result">等待操作...</pre>
  </div>

  <!-- 保存对话 -->
  <div class="card">
    <h2>💾 保存对话 POST /api/chat/save</h2>
    <label>用户 ID</label><input id="save-userid" type="number" value="1">
    <label>问题</label><input id="save-question" placeholder="用户问的问题" value="什么是机器学习？">
    <label>回答</label><textarea id="save-answer" rows="2" placeholder="AI 的回答">机器学习是人工智能的一个分支...</textarea>
    <button onclick="doSaveChat()">保存（需登录）</button>
    <pre id="save-result">等待操作...</pre>
  </div>

  <!-- 查历史 -->
  <div class="card">
    <h2>📜 查历史 GET /api/chat/history</h2>
    <label>用户 ID</label><input id="hist-userid" type="number" value="1">
    <button onclick="doHistory()">查询（需登录）</button>
    <pre id="hist-result">等待操作...</pre>
  </div>

  <!-- 查看反馈 -->
  <div class="card full">
    <h2>👥 查看反馈 GET /api/feedbacks</h2>
    <button onclick="doFeedbacks()" style="width:200px;">查询反馈（需登录）</button>
    <pre id="feedbacks-result">等待操作...</pre>
  </div>
</div>

<script>
const BASE = 'http://localhost:3000';
let savedToken = '';

function $(id) { return document.getElementById(id); }

function pre(id, obj) {
  $(id).textContent = JSON.stringify(obj, null, 2);
}

async function doRegister() {
  const body = {
    username: $('reg-username').value.trim(),
    email:    $('reg-email').value.trim(),
    password: $('reg-password').value
  };
  try {
    const res = await fetch(BASE + '/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    pre('reg-result', data);
  } catch(e) {
    pre('reg-result', { error: e.message });
  }
}

async function doLogin() {
  const body = {
    username: $('login-username').value.trim(),
    password: $('login-password').value
  };
  try {
    const res = await fetch(BASE + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    pre('login-result', data);
    if (data.success && data.data && data.data.token) {
      savedToken = data.data.token;
      $('token-display').textContent = 'Token: ' + savedToken;
    }
  } catch(e) {
    pre('login-result', { error: e.message });
  }
}

async function doChat() {
  const body = {
    user_id: Number($('chat-userid').value),
    message: $('chat-message').value.trim()
  };
  try {
    const res = await fetch(BASE + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    pre('chat-result', data);
  } catch(e) {
    pre('chat-result', { error: e.message });
  }
}

async function doFeedback() {
  const body = {
    name:    $('fb-name').value.trim(),
    email:   $('fb-email').value.trim(),
    content: $('fb-content').value.trim()
  };
  try {
    const res = await fetch(BASE + '/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    pre('fb-result', data);
  } catch(e) {
    pre('fb-result', { error: e.message });
  }
}

async function doSaveChat() {
  if (!savedToken) {
    pre('save-result', { error: '请先登录获取 Token' });
    return;
  }
  const body = {
    user_id:  Number($('save-userid').value),
    question: $('save-question').value.trim(),
    answer:   $('save-answer').value.trim()
  };
  try {
    const res = await fetch(BASE + '/api/chat/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'token': savedToken },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    pre('save-result', data);
  } catch(e) {
    pre('save-result', { error: e.message });
  }
}

async function doHistory() {
  if (!savedToken) {
    pre('hist-result', { error: '请先登录获取 Token' });
    return;
  }
  const uid = Number($('hist-userid').value);
  try {
    const res = await fetch(BASE + '/api/chat/history?user_id=' + uid, {
      headers: { 'token': savedToken }
    });
    const data = await res.json();
    pre('hist-result', data);
  } catch(e) {
    pre('hist-result', { error: e.message });
  }
}

async function doFeedbacks() {
  if (!savedToken) {
    pre('feedbacks-result', { error: '请先登录获取 Token' });
    return;
  }
  try {
    const res = await fetch(BASE + '/api/feedbacks', {
      headers: { 'token': savedToken }
    });
    const data = await res.json();
    pre('feedbacks-result', data);
  } catch(e) {
    pre('feedbacks-result', { error: e.message });
  }
}
</script>
</body>
</html>
