<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电路/自控可视化演示 - AGZ</title>
    <style>
        :root {
            --accent: #4a90e2;
            --accent-hover: #357abd;
            --bg: #f5f5f5;
            --card-bg: #fff;
            --text: #333;
            --muted: #999;
            --border: #e0e0e0;
            --bubble-ai: #f0f7ff;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: var(--accent);
        }
        
        .subtitle {
            color: var(--muted);
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .concept-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .concept-btn {
            padding: 10px 20px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--card-bg);
            color: var(--text);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .concept-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        
        .concept-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        
        .visualization-area {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }
        
        .viz-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .viz-description {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 20px;
        }
        
        .viz-canvas-container {
            position: relative;
            background: #fafafa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: auto;
        }
        
        .control-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        
        .control-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .param-row {
            margin-bottom: 16px;
        }
        
        .param-row:last-child {
            margin-bottom: 0;
        }
        
        .param-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .param-label {
            font-size: 13px;
            color: var(--text);
        }
        
        .param-value {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            font-family: monospace;
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--border);
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        .formula-box {
            margin-top: 20px;
            padding: 12px 16px;
            background: var(--bubble-ai);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            color: var(--text);
        }
        
        .info-section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-top: 20px;
        }
        
        .info-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        
        .info-item {
            padding: 12px;
            background: var(--bg);
            border-radius: 8px;
        }
        
        .info-label {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 4px;
        }
        
        .info-value {
            font-size: 14px;
            font-weight: 600;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="页面/页面5.html" class="back-link">← 返回概念图解</a>
        
        <h1>⚡ 电路/自控可视化演示</h1>
        <div class="subtitle">基于邱关源《电路》+ 自动控制原理 · 动态参数调节 · 实时渲染</div>
        
        <!-- 概念选择器 -->
        <div class="concept-selector" id="conceptSelector">
            <button class="concept-btn active" data-concept="rc_charge">RC充电</button>
            <button class="concept-btn" data-concept="rc_discharge">RC放电</button>
            <button class="concept-btn" data-concept="rl_charge">RL充电</button>
            <button class="concept-btn" data-concept="rlc_response">RLC响应</button>
            <button class="concept-btn" data-concept="sinusoidal_steady">正弦稳态</button>
            <button class="concept-btn" data-concept="step_response">阶跃响应</button>
            <button class="concept-btn" data-concept="pid_control">PID控制</button>
        </div>
        
        <!-- 可视化区域 -->
        <div class="visualization-area">
            <div class="viz-title" id="vizTitle">RC电路充电过程</div>
            <div class="viz-description" id="vizDesc">RC串联电路充电电压曲线，观察时间常数τ对充电速度的影响</div>
            
            <div class="viz-canvas-container">
                <canvas id="vizCanvas" width="800" height="400"></canvas>
            </div>
            
            <!-- 参数控制面板 -->
            <div class="control-panel" id="controlPanel">
                <div class="control-title">🎛️ 参数调节</div>
                <div id="paramsContainer"></div>
                <div class="formula-box" id="formulaBox">📐 Vc(t) = V0(1-e^{-t/τ}), τ=RC</div>
            </div>
        </div>
        
        <!-- 知识点信息 -->
        <div class="info-section">
            <div class="info-title">📚 知识点详情</div>
            <div class="info-grid" id="infoGrid">
                <div class="info-item">
                    <div class="info-label">所属章节</div>
                    <div class="info-value" id="infoChapter">第7章</div>
                </div>
                <div class="info-item">
                    <div class="info-label">可视化类型</div>
                    <div class="info-value" id="infoType">暂态响应</div>
                </div>
                <div class="info-item">
                    <div class="info-label">核心公式</div>
                    <div class="info-value" id="infoFormula">Vc(t) = V0(1-e^{-t/τ})</div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="concept-config.js"></script>
    <script src="visualization-engine.js"></script>
    <script>
        // 初始化
        const canvas = document.getElementById('vizCanvas');
        const engine = new VisualizationEngine(canvas);
        let currentConcept = 'rc_charge';
        
        // 概念配置映射
        const conceptConfigs = {
            rc_charge: CONCEPT_VISUALIZATION_CONFIG.circuit.rc_charge,
            rc_discharge: CONCEPT_VISUALIZATION_CONFIG.circuit.rc_discharge,
            rl_charge: CONCEPT_VISUALIZATION_CONFIG.circuit.rl_charge,
            rlc_response: CONCEPT_VISUALIZATION_CONFIG.circuit.rlc_response,
            sinusoidal_steady: CONCEPT_VISUALIZATION_CONFIG.circuit.sinusoidal_steady,
            step_response: CONCEPT_VISUALIZATION_CONFIG.control.step_response,
            pid_control: CONCEPT_VISUALIZATION_CONFIG.control.pid_control
        };
        
        // 创建参数控件
        function createParams(config) {
            const container = document.getElementById('paramsContainer');
            container.innerHTML = '';
            
            for (const [key, param] of Object.entries(config.params)) {
                const row = document.createElement('div');
                row.className = 'param-row';
                
                const header = document.createElement('div');
                header.className = 'param-header';
                
                const label = document.createElement('span');
                label.className = 'param-label';
                label.textContent = param.label;
                
                const value = document.createElement('span');
                value.className = 'param-value';
                value.id = `param-${key}-value`;
                value.textContent = `${formatValue(param.default, param)}${param.unit ? ' ' + param.unit : ''}`;
                
                header.appendChild(label);
                header.appendChild(value);
                
                const input = document.createElement('input');
                input.type = 'range';
                input.min = param.range[0];
                input.max = param.range[1];
                input.step = param.step || (param.range[1] - param.range[0]) / 100;
                input.value = param.default;
                engine.params[key] = param.default;
                
                input.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    engine.params[key] = val;
                    value.textContent = `${formatValue(val, param)}${param.unit ? ' ' + param.unit : ''}`;
                    render();
                });
                
                row.appendChild(header);
                row.appendChild(input);
                container.appendChild(row);
            }
        }
        
        // 格式化数值
        function formatValue(val, param) {
            if (param.step && param.step < 0.01) return val.toFixed(6);
            if (param.step && param.step < 1) return val.toFixed(2);
            return val.toFixed(1);
        }
        
        // 渲染
        function render() {
            const config = conceptConfigs[currentConcept];
            if (!config) return;
            
            engine.clear();
            
            // 根据概念类型渲染
            switch (currentConcept) {
                case 'rc_charge':
                    engine.renderRCTransient('charge');
                    break;
                case 'rc_discharge':
                    engine.renderRCTransient('discharge');
                    break;
                case 'rl_charge':
                    engine.renderRLTransient();
                    break;
                case 'rlc_response':
                    engine.renderRLCTransient();
                    break;
                case 'sinusoidal_steady':
                    engine.renderSinusoidal();
                    break;
                case 'step_response':
                    engine.renderStepResponse();
                    break;
                case 'pid_control':
                    engine.renderPIDResponse();
                    break;
            }
            
            // 更新信息
            document.getElementById('vizTitle').textContent = config.name;
            document.getElementById('vizDesc').textContent = config.description;
            document.getElementById('formulaBox').textContent = `📐 ${config.formula}`;
            document.getElementById('infoChapter').textContent = `第${config.chapter}章`;
            document.getElementById('infoType').textContent = config.type;
            document.getElementById('infoFormula').textContent = config.formula;
        }
        
        // 概念按钮点击
        document.querySelectorAll('.concept-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.concept-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentConcept = btn.dataset.concept;
                const config = conceptConfigs[currentConcept];
                if (config) {
                    createParams(config);
                    render();
                }
            });
        });
        
        // 初始化
        const initialConfig = conceptConfigs[currentConcept];
        if (initialConfig) {
            createParams(initialConfig);
            render();
        }
    </script>
</body>
</html>
